schema_version: 1
targets:
  - target_id: wesmart-pre
    environment: pre
    allow_remote: true
    base_url: https://pre-agent.example.test/api/bullgpt-vega
    allowed_origins: [https://pre-agent.example.test]
    allowed_peer_cidrs: []
    enabled: false
    protocol_reviewed: false
    source_commit: unknown
    scope_revision: pre-chat-review-required-v1
    identity_ref: pre-test-account-a
    simulation: false
    allowed_cases: [T03]
    headers_env: {}
    # Resolve locally; never paste captured credentials or existing session IDs here.
    # headers_env: {access_token: WESMART_PRE_ACCESS_TOKEN, did: WESMART_PRE_DEVICE_ID}
    headers:
      app: global
      app-group: broker
      appid: wb_vegax
      device-type: Web
      platform: web
      os: web
      hl: en
      content-type: application/json
      origin: https://pre-ui.example.test
      referer: https://pre-ui.example.test/
      tz: Asia/Hong_Kong
      ver: 1.0.0
    query_params: {appID: work}
    # query_params_env: {workspaceID: WESMART_PRE_WORKSPACE_ID}
    model_selection: {modelID: fixture-model, providerID: fixture-provider}
    session_mode: client_message_id
    response_channel: session_event
    generate_message_ids: false
    timestamp_header: true
    # Client generates ses_ ID; POST /session/message/id before each prompt.
    # response_channel: prompt_sse parses the POST stream directly instead of subscribing.
    # Server-allocated messageID is used for the user prompt; replies have their own ID.
    # session_event is the user-reported PRE reply source. Live verification is pending.
    budget:
      requests_per_second: 1
      request_timeout_seconds: 60
      case_timeout_seconds: 180
