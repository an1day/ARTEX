    simulation: false
    allowed_cases: [T03]
    headers_env: {}
    # headers_env: {Authorization: WESMART_PRE_AUTH_HEADER}
    budget:
      requests_per_second: 1
      request_timeout_seconds: 60
      case_timeout_seconds: 180
