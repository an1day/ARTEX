schema_version: 1
targets:
  - target_id: wesmart-pre
    environment: pre
    allow_remote: true
    base_url: https://pre-agent.example.test
    allowed_origins: [https://pre-agent.example.test]
    allowed_peer_cidrs: []
    enabled: false
    protocol_reviewed: false
    source_commit: unknown
    scope_revision: pre-chat-review-required-v1
