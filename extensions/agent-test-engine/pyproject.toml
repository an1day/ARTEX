[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "artex-agent-test-engine"
version = "0.1.0"
description = "Scoped Agent protocol tests and evidence service for ARTEX"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "PyYAML>=6,<7", "mcp>=1.29,<2", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
agent-test-service = "ai_protocol_fuzzer.service.server:main"
agent-test-demo = "ai_protocol_fuzzer.service.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
